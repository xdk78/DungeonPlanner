# Packages and uploads a release when a version tag (v1.2.3) is pushed. The CurseForge project ID (1808067) is read
# from ## X-Curse-Project-ID in DungeonPlanner.toc; the packager maps ## Interface: 16xxx to the "forever" game type.
# Uploading to CurseForge needs the repository secret CF_API_KEY (a CurseForge API token); without it the packager
# builds the zip and the GitHub release and skips CurseForge.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - name: Offline tests
        run: lua tests/run.lua
      # Only this version's section of CHANGELOG.md, its paths linked to the tag (.pkgmeta manual-changelog: the
      # CurseForge file's changelog and the GitHub release's text). Fails when CHANGELOG.md has no section for the tag.
      - name: Changelog of this release
        run: |
          mkdir -p .release
          lua tools/release_changelog.lua "$GITHUB_REF_NAME" --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --out .release/CHANGELOG-release.md
          cat .release/CHANGELOG-release.md
      - uses: BigWigsMods/packager@v2
